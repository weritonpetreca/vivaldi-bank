server:
  port: 8080

spring:
  application:
    name: vivaldi-bank

  # Conexão com o banco de dados (PostgreSQL)
  datasource:
    url: jdbc:postgresql://${DB_HOST:5432}:${DB_PORT:5432}/${DB_NAME:vivaldi_bank}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Migration (Flyway)
  flyway:
    enabled: true
    baseline-on-migrate: true

  # Config AWS
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: ${AWS_ACCESS_KEY:test}
        secret-key: ${AWS_SECRET_KEY:test}
      endpoint: ${AWS_ENDPOINT:http://localhost:4566}
      s3:
        path-style-access-enabled: true

# noinspection undefined
vivaldi:
  queues:
    transacoes: transacoes-events
    clientes: clientes-events
    login: login-events
  security:
    jwt-secret: ${JWT_SECRET:senha_padrao_dev}

# Monitoramento
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
logging:
  level:
    # Mostra o SQL (select * from...)
    org.hibernate.SQL: DEBUG
    # Mostra os parâmetros (o que entra no lugar do ?)
    org.hibernate.orm.jdbc.bind: TRACE
