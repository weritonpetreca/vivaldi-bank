[versions]
javaJwt = "4.4.0"
springCloudAws = "3.1.0"
springDoc = "2.8.4"
archunit = "1.3.0"

[libraries]
java-jwt = { group = "com.auth0", name = "java-jwt", version.ref = "javaJwt" }

spring-cloud-aws-starter = { group = "io.awspring.cloud", name = "spring-cloud-aws-starter", version.ref = "springCloudAws"}
spring-cloud-aws-sqs = { group = "io.awspring.cloud", name = "spring-cloud-aws-starter-sqs", version.ref = "springCloudAws"}

springdoc-openapi = { group = "org.springdoc", name = "springdoc-openapi-starter-webmvc-ui", version.ref = "springDoc"}

archunit-junit5 = { group = "com.tngtech.archunit", name = "archunit-junit5", version.ref = "archunit"}
